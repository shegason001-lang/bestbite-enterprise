function renderCart(){let box=document.getElementById('cartContent');if(!box)return;let sub=cart.reduce((s,x)=>s+x.price*x.qty,0),delivery=sub?600:0;box.innerHTML=cart.length?cart.map(x=>`<div class="cart-item"><img src="${x.img}"><div class="meta"><b>${x.name}</b><div>${naira(x.price)}</div><div class="qty"><button onclick="changeQty(${x.id},-1)">−</button><span>${x.qty}</span><button onclick="changeQty(${x.id},1)">+</button><button class="remove" onclick="remove(${x.id})">✕</button></div></div></div>`).join('')+`<div class="totals"><div class="row"><span>Subtotal</span><b>${naira(sub)}</b></div><div class="row"><span>Delivery Fee</span><b>${naira(delivery)}</b></div><div class="row total"><span>Total</span><b>${naira(sub+delivery)}</b></div><button class="primary full" onclick="document.getElementById('checkout').scrollIntoView()">Proceed to Checkout →</button></div>`:'<p style="color:#667085">Your cart is empty. Add a meal to get started.</p>';let s=document.getElementById('checkoutSummary');if(s)s.innerHTML=`<div class="totals"><div class="row"><span>Items</span><b>${naira(sub)}</b></div><div class="row"><span>Delivery</span><b>${naira(delivery)}</b></div><div class="row total"><span>Total</span><b>${naira(sub+delivery)}</b></div></div>`}
function add(id){let p=PRODUCTS.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({...p,qty:1});save();renderCart();toast(p.name+' added to cart');}
function changeQty(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);save();renderCart()}
function remove(id){cart=cart.filter(x=>x.id!==id);save();renderCart()}
function clearCart(){cart=[];save();renderCart();toast('Cart cleared')}
function setCat(c){currentCat=c;render();document.getElementById('menu').scrollIntoView({behavior:'smooth'});}
function searchProducts(){query=document.getElementById('navSearch').value.trim();render();document.getElementById('menu').scrollIntoView({behavior:'smooth'})}
function doHeroSearch(){query=document.getElementById('heroSearch').value.trim();document.getElementById('navSearch').value=query;render();document.getElementById('menu').scrollIntoView({behavior:'smooth'})}
function openCart(){document.getElementById('cart').scrollIntoView({behavior:'smooth'})}
function openAccount(){document.getElementById('account').scrollIntoView({behavior:'smooth'})}
function openMenu(){document.querySelector('.navlinks').style.display='flex';document.querySelector('.navlinks').style.position='absolute';document.querySelector('.navlinks').style.top='64px';document.querySelector('.navlinks').style.left='0';document.querySelector('.navlinks').style.right='0';document.querySelector('.navlinks').style.background='var(--ink)';document.querySelector('.navlinks').style.padding='20px';document.querySelector('.navlinks').style.flexDirection='column'}
async function createServerOrder(paymentMethod){
let name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),notes=document.getElementById("notes").value.trim(),email=document.getElementById("email").value.trim();
let items=cart.map(x=>({id:x.id,name:x.name,qty:x.qty,price_kobo:Math.round(x.price*100)}));
let payment_method=paymentMethod==="Paystack"?"paystack":paymentMethod==="Cash on Delivery"?"cash_on_delivery":paymentMethod==="Bank Transfer"?"bank_transfer":"whatsapp";
let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:name,customer_email:email,customer_phone:phone,delivery_address:address,notes,items,payment_method})});
let j=await r.json();if(!r.ok)throw new Error(j.error||'Could not create order');return j;
}
function finishLocalCart(){cart=[];save();renderCart();renderOrders()}
async function placeOrder(){
if(!cart.length)return toast("Add at least one item first");
let name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),address=document.getElementById("address").value.trim(),email=document.getElementById("email").value.trim();
if(!name||!phone||!address)return toast("Please complete your delivery details");
let payment=document.querySelector("input[name=pay]:checked").value;
if(payment==="Paystack"&&!email)return toast("Email is required for Paystack payment");
try{
  toast('Creating your order…');
  const created=await createServerOrder(payment);
  if(payment==="Paystack"){
    const r=await fetch('/api/paystack/initialize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({order_number:created.order.order_number})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||'Payment initialization failed');
    finishLocalCart(); window.location.href=j.authorization_url; return;
  }
  finishLocalCart();
  showModal(`<div class="success"><div class="check">✓</div><h2>Order Created Successfully!</h2><p>Your order <b>${created.order.order_number}</b> has been saved.</p><p>Send the order details to Bestbite on WhatsApp so we can confirm and prepare it.</p><a class="primary" style="display:inline-block;text-decoration:none" href="${created.whatsapp_url}" target="_blank">Send Order on WhatsApp</a></div>`);
}catch(e){console.error(e);toast(e.message||'Something went wrong. Please try again.')}
}
function renderOrders(){let box=document.getElementById('orders');if(!box)return;let orders=JSON.parse(localStorage.getItem('bestbite_orders')||'[]');box.innerHTML=orders.length?orders.slice(0,8).map(o=>`<div class="order"><div><b>${o.id}</b><div style="font-size:11px;color:#667085;margin-top:5px">${o.date} · ${o.items.map(i=>i.name+' × '+i.qty).join(', ')}</div></div><div><b>${naira(o.total)}</b><div class="status">${o.status}</div></div></div>`).join(''):'<div class="checkout-card"><p>No orders yet. Your completed orders will appear here.</p></div>'}
function showModal(html){document.getElementById('modalBox').innerHTML=`<div class="modal-head"><b>Bestbite Enterprise</b><button class="close" onclick="closeModal()">×</button></div>${html}`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
updateBadge();render();
</script></body></html>
