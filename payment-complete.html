<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bestbite — Payment</title><style>body{font-family:Arial,sans-serif;background:#f6f8fa;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:#fff;padding:35px;border-radius:18px;max-width:520px;text-align:center;box-shadow:0 15px 50px #0001}h1{color:#111} .ok{color:#118a4b;font-size:55px}.bad{color:#c62828;font-size:55px}.btn{display:inline-block;background:#ffc400;color:#111;text-decoration:none;font-weight:800;padding:12px 18px;border-radius:10px}</style></head><body><div class="box"><div id="icon">⌛</div><h1 id="title">Verifying payment…</h1><p id="msg">Please wait while we securely confirm your Paystack payment.</p><a class="btn" href="/">Back to Bestbite</a></div><script>(async()=>{const ref=new URLSearchParams(location.search).get('reference');if(!ref){icon.textContent='✕';icon.className='bad';title.textContent='No payment reference';msg.textContent='We could not find a payment reference.';return}try{const r=await fetch('/api/paystack/verify/'+encodeURIComponent(ref));const j=await r.json();if(!r.ok||!j.paid)throw new Error(j.error||'Payment was not successful');icon.textContent='✓';icon.className='ok';title.textContent='Payment successful!';msg.textContent=`Order ${j.order_number} has been paid and recorded. Bestbite can now process your order.`}catch(e){icon.textContent='✕';icon.className='bad';title.textContent='Payment could not be confirmed';msg.textContent=e.message||'Please contact Bestbite if money was deducted.'}})();</script></body></html>
